# ============================================================================
# Theme (Gruvbox-like)
# ============================================================================

background #32302f
foreground #d5c4a1

selection_background #504945
selection_foreground #ebdbb2

cursor #d5c4a1
cursor_text_color #32302f

color0  #32302f
color1  #fb4934    # red
color2  #b8bb26    # green
color3  #fabd2f    # yellow
color4  #83a598    # blue
color5  #d3869b    # magenta
color6  #8ec07c    # cyan
color7  #d5c4a1    # light gray

color8  #665c54
color9  #fb4934    # light red
color10 #b8bb26    # light green
color11 #fabd2f    # light yellow
color12 #83a598    # light blue
color13 #d3869b    # light magenta
color14 #8ec07c    # light cyan
color15 #fbf1c7    # dark gray

tab_bar_background #3c3836
active_tab_foreground #b8bb26
active_tab_background #504945

inactive_tab_foreground #a89984
inactive_tab_background #3c3836

active_border_color #ebdbb2
inactive_border_color #504945

bell_border_color #fb4934

# ============================================================================
# Fonts
# ============================================================================

font_family      family="Iosevka Nerd Font Mono" postscript_name=IosevkaNFM
font_features IosevkaNFM -calt -clig -liga
font_size 16.0

# ============================================================================
# Window
# ============================================================================

remember_window_size no
initial_window_width 120c
initial_window_height 40c

window_border_width 1.5pt
window_padding_width 3 3 0 3
# hide_window_decorations titlebar-only

enabled_layouts splits,stack

# ============================================================================
# Cursor
# ============================================================================

cursor_shape underline
cursor_shape_unfocused block
cursor_underline_thickness 3.0
cursor_blink_interval 0
cursor_trail 1
cursor_trail_decay 0.2 0.4
cursor_trail_start_threshhold 2

shell_integration enabled no-cursor

# ============================================================================
# Visual
# ============================================================================

sync_to_monitor yes

enable_audio_bell no
scrollbar never
progress_bar top

url_style straight
detect_urls yes
show_hyperlink_targets ctrl

resize_in_steps yes

inactive_text_alpha 0.5

# ============================================================================
# Tab Bar
# ============================================================================

tab_title_max_length 64

tar_bar_edge bottom
tab_bar_style powerline
tab_powerline_style angled
tab_bar_align left

active_tab_font_style normal
inactive_tab_font_style normal

tab_bar_show_new_tab_button yes
tab_bar_min_tabs 1

tab_activity_symbol "+"

tab_title_template "{index}{activity_symbol} {title}{fmt.fg._3C3836}"
active_tab_title_template "{index}{activity_symbol} {title}"

# ============================================================================
# Keybinds
# ============================================================================

# Leader: Ctrl + Space

# Tab Navigation
map alt+1 goto_tab 1
map alt+2 goto_tab 2
map alt+3 goto_tab 3
map alt+4 goto_tab 4
map alt+5 goto_tab 5
map alt+6 goto_tab 6
map alt+7 goto_tab 7
map alt+8 goto_tab 8
map alt+9 goto_tab 9

map ctrl+tab next_tab
map ctrl+shift+tab previous_tab

# Tab Management
map alt+shift+[ move_tab_backward
map alt+shift+] move_tab_forward
map ctrl+space>c new_tab_with_cwd
map ctrl+space>r set_tab_title
map ctrl+space>w close_tab

# Window Navigation
map alt+h neighboring_window left
map alt+j neighboring_window bottom
map alt+k neighboring_window top
map alt+l neighboring_window right

map ctrl+space>x close_window_with_confirmation

# Zoom/Hide Other Windows/Panes
map ctrl+space>z toggle_layout stack

# Splits
map ctrl+space>backslash launch --location=vsplit --cwd=current
map ctrl+space>shift+backslash launch --location=hsplit --cwd=current

# Swap Windows (panes)
map ctrl+space>shift+p swap_with_window
