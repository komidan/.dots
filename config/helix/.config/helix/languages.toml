[use-grammars]
only = [
  # Programming Languages
  "c",
  "cpp",
  "cmake",
  "make",
  "python",
  "lua",
  "css",

  # Data Files
  "toml",
  "yaml",
  "ini",
  "json",
  "jsonc",
  "csv",

  # General
  "bash",
  "regex",
  "sql",
  "markdown",
]

# Programming Languages
[[language]]
name = "c"
indent = { unit = "  ", tab-width = 2 }
file-types = [ "c", "h", "sma", "inc" ]
rulers = [ 81 ]
text-width = 80

[[language]]
name = "cpp"
indent = { unit = "  ", tab-width = 2 }
rulers = [ 81 ]
text-width = 80

[[language]]
name = "python"
indent = { unit = "  ", tab-width = 2 }
file-types = [ "py" ]

# Data Languages

# General

[[language]]
name = "git-commit"
rulers = [ 50, 72 ]
