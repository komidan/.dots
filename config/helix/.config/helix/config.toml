# ============================================================================
# Theme
# ============================================================================

theme = "maya"

# ============================================================================
# Editor
# ============================================================================

[editor]
# General behavior
auto-completion = false
auto-format = false
completion-replace = false
completion-timeout = 250
completion-trigger-len = 2
continue-comments = true
idle-timeout = 200
mouse = true
path-completion = true
preview-completion-insert = true
scroll-lines = 6

# Appearance
bufferline = "multiple"
color-modes = true
cursorcolumn = false
cursorline = false
gutters = ["diff", "diagnostics", "spacer", "line-numbers", "spacer"]
line-number = "relative"
true-color = true

# Indentation and formatting
editor-config = true
indent-heuristic = "tree-sitter"
insert-final-newline = true
trim-trailing-whitespace = true

# Clipboard
clipboard-provider = "wayland"
middle-click-paste = false

# Diagnostics
end-of-line-diagnostics = "disable"

# Popups and information
auto-info = true
popup-border  = "all"

# ============================================================================
# Diagnostics
# ============================================================================

[editor.inline-diagnostics]
cursor-line = "warning"
other-lines = "disable"

# ============================================================================
# File Picker
# ============================================================================

[editor.file-picker]
hidden = false
git-ignore = false
ignore = true
max-depth = 12 # Limit traversal depth to reduce unnecessary filesystem scanning.

# ============================================================================
# Smart Tab
# ============================================================================

[editor.smart-tab]
enable = false
supersede-menu = true # Give priority to menus

# ============================================================================
# Search
# ============================================================================

[editor.search]
wrap-around = false

# ============================================================================
# Cursor
# ============================================================================

[editor.cursor-shape]
normal = "block"
insert = "underline"
select = "bar"

# ============================================================================
# Statusline
# ============================================================================

[editor.statusline]
separator = "/"

# Left: editing state and diagnostics
left = [
  "mode",
  "file-modification-indicator",
  "spinner",
  "register",
  "read-only-indicator",
  "diagnostics",
]

# Center: cursor position and document information
center = [
  "selections",
  "separator",
  "position",
  "position-percentage",
  "spacer",
  "separator",
  "total-line-numbers",
]

# Right: project and file information
right = [
  "version-control",
  "workspace-diagnostics",
  "file-type",
  "file-encoding",
]

# Mode labels
mode.normal = "NORMAL"
mode.insert = "INSERT"
mode.select = "SELECT"

# Diagnostic indicators
diagnostics = ["warning", "error"]

# ============================================================================
# Whitespace
# ============================================================================

[editor.whitespace.render]
space   = "all"
tab     = "all"
nbsp    = "all"
nnbsp   = "all"
newline = "none"

[editor.whitespace.characters]
tab    = "≻"
tabpad = "-"

# ============================================================================
# Indentation Guides
# ============================================================================

[editor.indent-guides]
render      = true
character   = "|" # Alternative: "│"
skip-levels = 1

# ============================================================================
# Soft Wrap
# ============================================================================

[editor.soft-wrap]
enable = true
wrap-at-text-width = false

# ============================================================================
# LSP
# ============================================================================

[editor.lsp]
auto-signature-help = false

# ============================================================================
# Keybindings
# ============================================================================

# Normal mode
[keys.normal]
C-d = ["page_cursor_half_down", "align_view_center"]
C-u = ["page_cursor_half_up", "align_view_center"]

[keys.normal."C-l"]
2 = ":indent-style 2"
4 = ":indent-style 4"
r = ":reflow"

[keys.normal.0]
c = ":open ~/.config/helix/config.toml"
l = ":open ~/.config/helix/languages.toml"
m = "@|bash -c 'echo $(( $(cat) ))'<ret>"
r = ":config-reload"

[keys.normal.space]
z = ":toggle soft-wrap.enable"

# Select mode
[keys.select]
C-d = ["page_cursor_half_down", "align_view_center"]
C-u = ["page_cursor_half_up", "align_view_center"]
S-j = "move_line_up"

# Insert mode
[keys.insert]
C-k = "signature_help"
C-n = "completion"
